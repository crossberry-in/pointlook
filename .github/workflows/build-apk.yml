name: Build APK & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Local prebuild + gradle build — no Expo account / EXPO_TOKEN required
      - name: Expo prebuild (local, no expo login)
        run: npx expo prebuild --platform android --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1

      - name: Tune Gradle memory
        run: echo "org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m" >> android/gradle.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release buildType is signed with the auto-generated debug.keystore,
      # so the APK is installable without any signing secrets
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        working-directory: android

      - name: Organize APK output
        run: |
          mkdir -p dist
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          APK_NAME="pointlook-${APP_VERSION}-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${APK_NAME}"
          echo "APK_PATH=dist/${APK_NAME}" >> "$GITHUB_ENV"
          echo "Built: ${APK_NAME}"

      - name: Upload APK artifact (every run)
        uses: actions/upload-artifact@v4
        with:
          name: pointlook-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
