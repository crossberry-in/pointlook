name: Debug Emulator (logcat + screenshots)

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'APK URL to install (empty = latest release asset)'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/debug-emulator.yml'

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Resolve APK URL (latest release asset by default)
        id: apk
        run: |
          if [ -n "${{ github.event.inputs.apk_url }}" ]; then
            URL="${{ github.event.inputs.apk_url }}"
          else
            URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['assets'][0]['browser_download_url'])")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Downloading: $URL"

      - name: Download APK
        run: |
          curl -sL -o app.apk "${{ steps.apk.outputs.url }}"
          ls -la app.apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Run emulator, install APK, capture evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            adb install -t -r -g app.apk

            adb logcat -c
            # Cold launch the app
            adb shell monkey -p com.crossberry.pointlook -c android.intent.category.LAUNCHER 1
            sleep 8
            adb exec-out screencap -p > shot-08s.png
            sleep 10
            adb exec-out screencap -p > shot-18s.png
            sleep 15
            adb exec-out screencap -p > shot-33s.png

            # Deep-link into the feature screens (expo-router scheme routing)
            adb shell am start -a android.intent.action.VIEW -d "pointlook://settings" com.crossberry.pointlook
            sleep 6
            adb exec-out screencap -p > shot-settings.png
            adb shell am start -a android.intent.action.VIEW -d "pointlook://downloads" com.crossberry.pointlook
            sleep 5
            adb exec-out screencap -p > shot-downloads.png
            adb shell am start -a android.intent.action.VIEW -d "pointlook://devtools" com.crossberry.pointlook
            sleep 5
            adb exec-out screencap -p > shot-devtools.png

            # ---- WebView TOUCH TEST --------------------------------------
            # IMPORTANT: the runner's default AVD is 320x640 (avdmanager
            # default), NOT 1080x1920. All coordinates are computed from
            # `wm size` (device-side layout is ~160dpi, so dp ~= px here).
            # Each line recomputes W/H because android-emulator-runner runs
            # the script LINE BY LINE (separate `sh -c`, no shared vars).
            adb shell am force-stop com.crossberry.pointlook
            sleep 2
            adb shell monkey -p com.crossberry.pointlook -c android.intent.category.LAUNCHER 1
            sleep 8
            # tap the omnibox (top bar, centered) using real screen size
            adb shell wm size | grep -oE "[0-9]+x[0-9]+" | { read WH; W=${WH%x*}; H=${WH#*x}; adb shell input tap $((W/2)) $((H*8/100)); }
            sleep 2
            adb shell input text "en.wikipedia.org/wiki/Android"
            adb shell input keyevent 66
            sleep 14
            adb exec-out screencap -p > touch-A-loaded.png
            # ---- GROUND-TRUTH DIAGNOSTICS ---------------------------------
            # 1) focused window (do injections land in the app at all?)
            adb shell dumpsys window windows | grep -iE "mCurrentFocus|mFocusedWindow" || true
            # 2) native view hierarchy: classes + bounds around the WebView
            adb shell uiautomator dump /sdcard/ui.xml || true
            adb shell "cat /sdcard/ui.xml" | tr '>' '>\n' | grep -iE "webview|swiperefresh|scroll" | head -8 || true
            # swipe up (drag page content upward = scroll down), on-screen coords
            adb shell wm size | grep -oE "[0-9]+x[0-9]+" | { read WH; W=${WH%x*}; H=${WH#*x}; adb shell input swipe $((W/2)) $((H*60/100)) $((W/2)) $((H*20/100)) 400; }
            sleep 2
            adb exec-out screencap -p > touch-B-after-swipe.png
            # second swipe back down
            adb shell wm size | grep -oE "[0-9]+x[0-9]+" | { read WH; W=${WH%x*}; H=${WH#*x}; adb shell input swipe $((W/2)) $((H*20/100)) $((W/2)) $((H*60/100)) 400; }
            sleep 2
            adb exec-out screencap -p > touch-C-after-swipe-back.png
            # NOTE: android-emulator-runner executes the script LINE BY LINE
            # (each line becomes its own `sh -c`), so no multi-line heredocs
            # and no cross-line variables. The status-bar clock changes between
            # shots, so we look at the diff bounding box: a scroll differs over
            # most of the screen (height > 300px), a clock tick only in the top.
            pip3 install --quiet pillow || echo "pillow install failed - analysis will be skipped"
            python3 -c "from PIL import Image, ImageChops; a=Image.open('touch-A-loaded.png').convert('RGB'); b=Image.open('touch-B-after-swipe.png').convert('RGB'); c=Image.open('touch-C-after-swipe-back.png').convert('RGB'); ab=ImageChops.difference(a,b).getbbox(); bc=ImageChops.difference(b,c).getbbox(); print('TOUCH-TEST A-vs-B diff-bbox:', ab, '=> SCROLLED, touch works' if ab and (ab[3]-ab[1])>300 else '=> NOT-SCROLLED, touch broken'); print('TOUCH-TEST B-vs-C diff-bbox:', bc, '=> SCROLLED-BACK, touch works' if bc and (bc[3]-bc[1])>300 else '=> NOT-SCROLLED-BACK')" || echo "TOUCH-TEST analysis failed (screenshots still uploaded)"

            # ---- QUICK ACTIONS PILL TEST ---------------------------------
            # Simulate the real gesture with raw motion events: press, hold
            # still for 1s (>420ms long-press window), drag DOWN (pill should
            # arm with refresh selected), screenshot, release (page reloads).
            adb shell wm size | grep -oE "[0-9]+x[0-9]+" | { read WH; W=${WH%x*}; H=${WH#*x}; adb shell input motionevent DOWN $((W/2)) $((H*50/100)); }
            sleep 1
            adb shell wm size | grep -oE "[0-9]+x[0-9]+" | { read WH; W=${WH%x*}; H=${WH#*x}; adb shell input motionevent MOVE $((W/2)) $((H*56/100)); adb shell input motionevent MOVE $((W/2)) $((H*62/100)); }
            sleep 1
            adb exec-out screencap -p > qa-pill-armed.png
            adb shell wm size | grep -oE "[0-9]+x[0-9]+" | { read WH; W=${WH%x*}; H=${WH#*x}; adb shell input motionevent UP $((W/2)) $((H*62/100)); }
            sleep 6
            adb exec-out screencap -p > qa-after-release.png

            # Is the process alive? What activities are up?
            adb shell "pidof com.crossberry.pointlook" || echo "PROCESS DEAD"
            adb shell dumpsys activity activities | grep -i -A2 "topResumedActivity\|mResumedActivity" || true

            adb logcat -d > logcat-full.txt
            adb logcat -d -b crash > logcat-crash.txt || true

            grep -a -E "ReactNativeJS|AndroidRuntime|FATAL|Process: com.crossberry|com.crossberry.pointlook|ExpoModules|expo|Hermes|Runtime" logcat-full.txt > logcat-relevant.txt || true

            echo "=== relevant logcat (first 200 lines) ==="
            head -200 logcat-relevant.txt || true
            echo "=== crash buffer ==="
            head -100 logcat-crash.txt || true

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-evidence
          path: |
            shot-*.png
            touch-*.png
            qa-*.png
            logcat-*.txt
          if-no-files-found: warn
          retention-days: 14
